# XDTV.FANS 2.0 (jschan/mchan) — nginx.
# Ruch przez Cloudflare Tunnel (cloudflared → 127.0.0.1:80), TLS kończy Cloudflare.
# Na podstawie configs/nginx/ z mchan; pliki postów serwuje R2 (cdn.xdtv.fans),
# tu zostają strony, CSS/JS, captcha i zasoby boardów z /var/www/xdtv/static.
#
# Wgranie:
#   sudo cp /var/www/xdtv/deploy/nginx/nowe.xdtv.fans.conf /etc/nginx/sites-available/
#   sudo ln -sf ../sites-available/nowe.xdtv.fans.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream xdtv_chan {
	server 127.0.0.1:7010;
	keepalive 16;
}

server {
	listen 80;
	server_name nowe.xdtv.fans;

	# Prawdziwe IP użytkownika. Przez tunel każde połączenie przychodzi
	# z 127.0.0.1 — bez OBU linii bany i limity antyspamowe jschan
	# trafiałyby we wszystkich naraz.
	set_real_ip_from 127.0.0.1;
	real_ip_header CF-Connecting-IP;

	# Limit całego żądania (do 5 plików w poście); szczegółowe limity
	# rozmiaru pilnuje jschan.
	client_max_body_size 100m;

	set $xdtv_static /var/www/xdtv/static;

	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "same-origin" always;
	add_header X-Frame-Options "SAMEORIGIN" always;

	error_page 404 /404.html;
	error_page 500 /500.html;
	error_page 502 /502.html;
	error_page 503 /503.html;
	error_page 504 /504.html;

	# Ścieżki boardów bez końcowego / i bez index.html
	# (bez /kanal/post/123 — to adres posta obsługiwany przez aplikację)
	if ($request_uri ~ ^/(?!captcha|randombanner|forms|logout|socket\.io|\w+/post/\d)) {
		rewrite ^([^.\?]*[^/])$ $1/ redirect;
		rewrite ^(.+)/$ $1/index.html redirect;
	}

	location = / {
		return 302 /index.html;
	}

	location = /robots.txt {
		access_log off;
		add_header Content-Type text/plain;
		# Wersja testowa — poza indeksem do czasu podmiany na xdtv.fans.
		return 200 "User-agent: *\nDisallow: /\n";
	}

	location = /favicon.ico {
		access_log off;
		expires max;
		root $xdtv_static/file;
		try_files $uri =404;
	}

	location /captcha {
		root $xdtv_static/captcha;
		if ($cookie_captchaid) {
			return 302 /captcha/$cookie_captchaid.jpg;
		}
		try_files /$cookie_captchaid.jpg @backend;
	}

	# Strony prywatne (panel, konto) zawsze z backendu, bez cache
	location ~* ^/((\w+/manage/.*|globalmanage/(reports|bans|recent|boards|filters|globallogs|custompages|news|editnews/.*|accounts|editaccount/.*|roles|editrole/.*|settings))|sessions|mypermissions|account|create|twofactor|csrf)\.(html|json)$ {
		expires 0;
		add_header Cache-Control "private, no-store" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "same-origin" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		try_files /dev/null @backend;
	}

	location ~* ^/(\w+)/custompage/(.*\.html)$ {
		return 302 /$1/page/$2;
	}

	# Stary adres posta → nowy (linki z zewnątrz, cytaty >>123 w komentarzach)
	location ~ ^/(\w+)/thread/(\d+)\.html$ {
		return 301 /$1/post/$2;
	}

	location ~* \.html$ {
		expires 0;
		root $xdtv_static/html;
		try_files $uri @backend;
	}

	location ~* \.json$ {
		expires 0;
		root $xdtv_static/json;
		try_files $uri @backend;
	}

	location ~* \.(css|js)$ {
		access_log off;
		expires 1w;
		root $xdtv_static;
		try_files $uri =404;
	}

	location ~* \.(png|jpg|jpeg|webmanifest|xml|ico|apng|bmp|webp|gif|mp4|webm|mov|mkv|svg|ttf|woff2)$ {
		access_log off;
		expires max;
		root $xdtv_static;
		try_files $uri =404;
	}

	# Formularze, socket.io i wszystko inne → aplikacja
	location / {
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_pass http://xdtv_chan;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_cache_bypass $http_upgrade;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Country-Code $http_cf_ipcountry;
	}

	location @backend {
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_pass http://xdtv_chan;
		proxy_http_version 1.1;
		proxy_set_header Connection '';
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Country-Code $http_cf_ipcountry;
	}
}
